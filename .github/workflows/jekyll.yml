name: Deploy Jekyll + Slidev to GitHub Pages

on:
  push:
    branches: ["main"]

  # Permette di avviare manualmente il workflow dalla tab Actions.
  workflow_dispatch:

# Permessi necessari per pubblicare su GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy concorrenti.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------------------------------
      # GitHub Pages configuration
      # -------------------------------------------------------

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # -------------------------------------------------------
      # Jekyll
      # -------------------------------------------------------

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build Jekyll
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # -------------------------------------------------------
      # Slidev
      # -------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm

      - name: Install Slidev dependencies
        working-directory: _slidev
        run: pnpm install --frozen-lockfile

      # -------------------------------------------------------
      # Build all Slidev presentations
      # -------------------------------------------------------

      - name: Build Slidev presentations
        working-directory: _slidev
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          for deck in decks/*; do

            if [ -f "$deck/slides.md" ]; then

              name=$(basename "$deck")

              echo "========================================"
              echo "Building Slidev presentation: $name"
              echo "Source: $deck/slides.md"
              echo "URL: ${PAGES_BASE_PATH}/slides/$name/"
              echo "========================================"

              pnpm exec slidev build "$deck/slides.md" \
                --base "${PAGES_BASE_PATH}/slides/$name/" \
                --out "$GITHUB_WORKSPACE/_site/slides/$name" \
                --router-mode hash \
                --without-notes

            fi

          done

      # -------------------------------------------------------
      # Upload complete site
      # -------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site


  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5