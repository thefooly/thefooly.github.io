name: Deploy Jekyll + Slidev to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # -------------------------
      # Build Jekyll
      # -------------------------

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # -------------------------
      # Setup Slidev
      # -------------------------

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Slidev dependencies
        working-directory: _slidev
        run: pnpm install --frozen-lockfile

      # -------------------------
      # Build all Slidev decks
      # -------------------------

      - name: Build Slidev presentations
        working-directory: _slidev
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          for deck in decks/*; do
            if [ -f "$deck/slides.md" ]; then
              name=$(basename "$deck")

              echo "Building Slidev deck: $name"

              pnpm exec slidev build "$deck/slides.md" \
                --base "${PAGES_BASE_PATH}/slides/$name/" \
                --out "../_site/slides/$name" \
                --without-notes
            fi
          done

      # -------------------------
      # Upload final site
      # -------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5