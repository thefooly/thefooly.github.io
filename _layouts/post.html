---
layout: default
---

<article>

    <header class="article-header">

        <h1>
            {{ page.title }}
        </h1>

        <div class="post-meta">

            {{ page.date | date: "%d.%m.%Y" }}

            {% if page.categories %}
                · {{ page.categories | join: ", " }}
            {% endif %}

        </div>

    </header>


    <div class="article-content">

        {{ content }}

    </div>

</article>
