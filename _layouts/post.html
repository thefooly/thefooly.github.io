---
layout: default
---

<div class="post-meta">
    <h1>
        {{ page.title }}
    </h1>
    <h2>
        {{ page.date | date: "%d.%m.%Y" }}
        
        {% if page.categories %}
            · {{ page.categories | join: ", " }}
        {% endif %}
    </h2>
</div>



<div class="article-content">
    {{ content }}
</div>
